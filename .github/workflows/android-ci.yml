name: Pixel Guard CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify_and_build:
    name: Test & Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Setup Mock Keystore Configuration for CI
        run: |
          mkdir -p keystore
          keytool -genkey -v -keystore keystore/pixelguard-release.jks -alias pixelguard_release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=PixelGuardCI, OU=Security, O=PixelGuard, L=MountainView, S=CA, C=US" \
            -storepass "PixelGuardSec2026!Prod" -keypass "PixelGuardSec2026!Prod"
          cp keystore.properties.example keystore.properties

      - name: Run Fast Unit Tests
        run: ./gradlew testFast --no-daemon --stacktrace

      - name: Run Full Unit & Presentation Robolectric Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android Lint Check
        run: ./gradlew lintDebug --no-daemon

      - name: Assemble Minified Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Production Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixelguard-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

